<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NEXUS // Developer Social Mesh</title>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%233b82f6' stroke-width='2.5' stroke-linecap='round' stroke-linejoin='round'><circle cx='12' cy='12' r='10'/><path d='m4.93 4.93 4.24 4.24'/><path d='m14.83 9.17 4.24-4.24'/><path d='m14.83 14.83 4.24 4.24'/><path d='m9.17 14.83-4.24 4.24'/><circle cx='12' cy='12' r='4'/></svg>">
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap');
    body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: #060913; }
    .font-brand { font-family: 'Space Grotesk', sans-serif; }

    #neural-canvas {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      z-index: 0;
      pointer-events: none;
    }

    .glass-nav {
      background: rgba(8, 12, 22, 0.85);
      backdrop-filter: blur(18px);
      border-bottom: 1px solid rgba(255, 255, 255, 0.08);
    }

    .glass-card {
      background: rgba(15, 23, 42, 0.7);
      backdrop-filter: blur(14px);
      border: 1px solid rgba(255, 255, 255, 0.07);
      transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
    }
  </style>
</head>
<body class="bg-[#060913] text-slate-100 min-h-screen flex flex-col antialiased relative selection:bg-blue-600 selection:text-white">

  <!-- Interactive Canvas -->
  <canvas id="neural-canvas"></canvas>

  <!-- Notification Toast -->
  <div id="toast" class="fixed bottom-6 right-6 z-50 transform translate-y-20 opacity-0 transition-all duration-300 bg-slate-900 border border-blue-500/30 text-white text-xs font-semibold px-4 py-3 rounded-2xl shadow-2xl flex items-center gap-2.5">
    <i data-lucide="radio" class="w-4 h-4 text-blue-500 animate-pulse"></i>
    <span id="toast-text">Mesh updated</span>
  </div>

  <!-- Header -->
  <header class="glass-nav sticky top-0 z-40 px-6 py-3.5 flex items-center justify-between">
    <div class="flex items-center gap-3">
      <div class="h-10 w-10 rounded-xl bg-gradient-to-tr from-blue-600 via-indigo-600 to-cyan-500 flex items-center justify-center shadow-lg shadow-blue-500/25 ring-1 ring-white/20">
        <svg class="w-5 h-5 text-white" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="10"/>
          <path d="m4.93 4.93 4.24 4.24"/>
          <path d="m14.83 9.17 4.24-4.24"/>
          <path d="m14.83 14.83 4.24 4.24"/>
          <path d="m9.17 14.83-4.24 4.24"/>
          <circle cx="12" cy="12" r="4"/>
        </svg>
      </div>
      <div>
        <span class="text-xl font-black tracking-wider bg-gradient-to-r from-white via-slate-100 to-blue-300 bg-clip-text text-transparent font-brand">NEXUS</span>
        <span class="text-[10px] block font-bold tracking-widest text-blue-400 uppercase -mt-0.5">Social Platform</span>
      </div>
    </div>
    
    <div class="flex items-center gap-2.5">
      <div id="user-info" class="hidden items-center gap-2">
        <!-- Edit Profile Trigger -->
        <button onclick="openEditProfileModal()" class="text-xs font-semibold px-3 py-1.5 rounded-xl bg-slate-900 border border-slate-700/80 hover:border-blue-500/50 text-slate-300 hover:text-white transition flex items-center gap-1.5">
          <i data-lucide="edit-3" class="w-3.5 h-3.5 text-blue-400"></i>
          <span>Edit Profile</span>
        </button>

        <a id="my-profile-link" href="#" class="text-xs font-semibold text-slate-200 hover:text-blue-400 transition flex items-center gap-2 bg-slate-900/80 border border-slate-700/60 px-3 py-1.5 rounded-xl">
          <div id="nav-avatar-slot"></div>
          <span id="my-name"></span>
        </a>

        <button onclick="logout()" class="text-xs font-semibold px-3 py-1.5 rounded-xl bg-slate-800 hover:bg-slate-700 text-slate-300 transition">Exit</button>
      </div>

      <button id="auth-btn" onclick="openAuthModal()" class="text-xs font-bold px-4 py-2 rounded-xl bg-gradient-to-r from-blue-600 to-indigo-600 text-white transition shadow-lg shadow-blue-500/25 flex items-center gap-1.5">
        <i data-lucide="user" class="w-3.5 h-3.5"></i>
        <span>Sign In</span>
      </button>
    </div>
  </header>

  <!-- Main Feed -->
  <main class="max-w-2xl mx-auto px-4 py-8 flex-1 w-full space-y-6 relative z-10">

    <!-- Broadcast Creator Box -->
    <div class="glass-card rounded-2xl p-5 border border-slate-750">
      <div class="flex items-center gap-2 mb-3">
        <i data-lucide="pen-tool" class="w-4 h-4 text-blue-400"></i>
        <h3 class="text-xs font-bold uppercase tracking-wider text-slate-300">Create Transmission</h3>
      </div>
      <textarea id="post-content" placeholder="Share technical findings, system architecture, or thoughts..." rows="3" class="w-full bg-slate-950/70 border border-slate-800 rounded-xl p-3.5 text-xs text-white placeholder-slate-500 outline-none focus:border-blue-500 transition resize-none"></textarea>
      
      <div class="relative mt-2.5">
        <i data-lucide="image" class="w-3.5 h-3.5 text-slate-500 absolute left-3.5 top-3"></i>
        <input type="text" id="post-media" placeholder="Attach Image URL (Unsplash, Imgur, or direct link)..." class="w-full pl-9 pr-3 py-2 bg-slate-950/70 border border-slate-800 rounded-xl text-xs text-white placeholder-slate-500 outline-none focus:border-blue-500 transition">
      </div>

      <div class="flex justify-between items-center mt-4 pt-3.5 border-t border-slate-800/80">
        <div class="flex items-center gap-2 text-[11px] text-slate-500">
          <span class="w-2 h-2 rounded-full bg-emerald-500 animate-pulse"></span>
          <span>NEXUS Synchronized</span>
        </div>
        <button onclick="publishPost()" class="px-4 py-2 rounded-xl bg-gradient-to-r from-blue-600 to-indigo-600 hover:opacity-95 text-white text-xs font-bold transition shadow-md shadow-blue-500/20 flex items-center gap-1.5">
          <i data-lucide="send" class="w-3.5 h-3.5"></i>
          <span>Publish</span>
        </button>
      </div>
    </div>

    <!-- Feed Stream -->
    <div id="feed-stream" class="space-y-4"></div>
  </main>

  <!-- Edit Profile Modal (Instagram Feature) -->
  <div id="edit-profile-modal" class="fixed inset-0 z-50 bg-black/80 backdrop-blur-md hidden items-center justify-center p-4">
    <div class="glass-card max-w-sm w-full rounded-2xl p-6 relative border border-slate-700 shadow-2xl">
      <button onclick="closeEditProfileModal()" class="absolute top-4 right-4 text-slate-400 hover:text-white">&times;</button>
      <h2 class="text-base font-bold text-white mb-1">Edit Your Profile</h2>
      <p class="text-slate-400 text-xs mb-4">Set your own custom avatar image and bio</p>
      
      <form onsubmit="handleProfileUpdate(event)" class="space-y-3">
        <div>
          <label class="block text-[11px] font-bold text-slate-400 uppercase mb-1">Display Name</label>
          <input type="text" id="edit-name" class="w-full px-3.5 py-2 rounded-xl bg-slate-900 border border-slate-700 text-xs text-white outline-none focus:border-blue-500">
        </div>
        <div>
          <label class="block text-[11px] font-bold text-slate-400 uppercase mb-1">Profile Picture URL</label>
          <input type="url" id="edit-avatar" placeholder="https://images.unsplash.com/... or leave empty" class="w-full px-3.5 py-2 rounded-xl bg-slate-900 border border-slate-700 text-xs text-white outline-none focus:border-blue-500">
          <span class="text-[10px] text-slate-500 mt-1 block">Leave empty to use automatic monogram placeholder</span>
        </div>
        <div>
          <label class="block text-[11px] font-bold text-slate-400 uppercase mb-1">Bio / Status</label>
          <textarea id="edit-bio" rows="2" class="w-full px-3.5 py-2 rounded-xl bg-slate-900 border border-slate-700 text-xs text-white outline-none focus:border-blue-500 resize-none"></textarea>
        </div>
        <button type="submit" class="w-full py-2.5 rounded-xl bg-blue-600 hover:bg-blue-500 text-white font-bold text-xs shadow-lg shadow-blue-500/25">Save Profile Changes</button>
      </form>
    </div>
  </div>

  <!-- Auth Modal -->
  <div id="auth-modal" class="fixed inset-0 z-50 bg-black/75 backdrop-blur-md hidden items-center justify-center p-4">
    <div class="glass-card max-w-sm w-full rounded-2xl p-6 relative border border-slate-700 shadow-2xl">
      <button onclick="closeAuthModal()" class="absolute top-4 right-4 text-slate-400 hover:text-white">&times;</button>
      <div class="flex items-center gap-2 mb-1">
        <i data-lucide="shield" class="w-4 h-4 text-blue-400"></i>
        <h2 id="auth-title" class="text-base font-bold text-white">Enter NEXUS</h2>
      </div>
      <p class="text-slate-400 text-xs mb-4">Connect into the verified network</p>
      
      <form onsubmit="handleAuth(event)" class="space-y-3">
        <div id="register-fields" class="space-y-3 hidden">
          <input type="text" id="reg-name" placeholder="Full Name" class="w-full px-3.5 py-2.5 rounded-xl bg-slate-900 border border-slate-700 text-xs text-white outline-none focus:border-blue-500">
          <input type="text" id="reg-handle" placeholder="System Handle (e.g. abinash)" class="w-full px-3.5 py-2.5 rounded-xl bg-slate-900 border border-slate-700 text-xs text-white outline-none focus:border-blue-500">
        </div>
        <input type="email" id="auth-email" placeholder="Email Address" required class="w-full px-3.5 py-2.5 rounded-xl bg-slate-900 border border-slate-700 text-xs text-white outline-none focus:border-blue-500">
        <input type="password" id="auth-password" placeholder="Password" required class="w-full px-3.5 py-2.5 rounded-xl bg-slate-900 border border-slate-700 text-xs text-white outline-none focus:border-blue-500">
        <button type="submit" class="w-full py-2.5 rounded-xl bg-gradient-to-r from-blue-600 to-indigo-600 text-white font-bold text-xs shadow-lg shadow-blue-500/25">Continue</button>
      </form>
      <p class="text-center text-xs text-slate-400 mt-4">
        <span id="auth-switch-text">New to NEXUS?</span>
        <button onclick="toggleAuthMode()" class="text-blue-400 hover:underline ml-1 font-semibold" id="auth-switch-btn">Sign up</button>
      </p>
    </div>
  </div>

  <script>
    let isRegister = false;
    const token = localStorage.getItem('pulse_token');
    let currentUser = JSON.parse(localStorage.getItem('pulse_user') || 'null');

    // Helper: Monogram Avatar generator if user has no custom image URL
    function renderAvatar(avatarUrl, name, sizeClass = "w-10 h-10") {
      if (avatarUrl && avatarUrl.trim().length > 0) {
        return `<img src="${avatarUrl}" class="${sizeClass} rounded-xl object-cover ring-1 ring-blue-500/40">`;
      }
      const initial = (name || 'U').charAt(0).toUpperCase();
      return `
        <div class="${sizeClass} rounded-xl bg-gradient-to-tr from-slate-800 to-slate-700 border border-slate-600 flex items-center justify-center font-bold text-white text-xs font-mono">
          ${initial}
        </div>
      `;
    }

    async function init() {
      syncUser();
      await loadFeed();
      lucide.createIcons();
    }

    function showToast(msg) {
      const t = document.getElementById('toast');
      document.getElementById('toast-text').innerText = msg;
      t.classList.remove('translate-y-20', 'opacity-0');
      setTimeout(() => t.classList.add('translate-y-20', 'opacity-0'), 2500);
    }

    function syncUser() {
      if (token && currentUser) {
        document.getElementById('auth-btn').classList.add('hidden');
        document.getElementById('user-info').classList.replace('hidden', 'flex');
        document.getElementById('my-name').innerText = `@${currentUser.handle}`;
        document.getElementById('nav-avatar-slot').innerHTML = renderAvatar(currentUser.avatar, currentUser.name, "w-5 h-5");
        document.getElementById('my-profile-link').href = `profile.html?handle=${currentUser.handle}`;
      }
    }

    async function loadFeed() {
      const res = await fetch('/api/posts');
      const posts = await res.json();
      const container = document.getElementById('feed-stream');

      container.innerHTML = posts.map(p => {
        const isLiked = currentUser && p.likes.includes(currentUser.id);
        const isAuthor = currentUser && p.author && p.author._id === currentUser.id;

        return `
          <article class="glass-card rounded-2xl p-5 border" id="post-${p._id}">
            <div class="flex items-center justify-between mb-3">
              <div class="flex items-center gap-3">
                <a href="profile.html?handle=${p.author.handle}">
                  ${renderAvatar(p.author.avatar, p.author.name, "w-10 h-10")}
                </a>
                <div>
                  <a href="profile.html?handle=${p.author.handle}" class="text-xs font-bold hover:text-blue-400 transition text-white">${p.author.name}</a>
                  <span class="text-[11px] text-slate-400 block -mt-0.5">@${p.author.handle}</span>
                </div>
              </div>

              <!-- Delete Post Option for Authors (Instagram style) -->
              ${isAuthor ? `
                <button onclick="deletePost('${p._id}')" class="text-slate-500 hover:text-rose-400 text-xs p-1 rounded-lg transition" title="Delete Transmission">
                  <i data-lucide="trash-2" class="w-4 h-4"></i>
                </button>
              ` : ''}
            </div>
            
            <p class="text-xs sm:text-sm leading-relaxed mb-3 text-slate-200">${p.content}</p>
            ${p.media ? `<img src="${p.media}" class="w-full max-h-80 object-cover rounded-xl mb-3 border border-slate-800">` : ''}

            <div class="flex items-center gap-6 pt-3 border-t border-slate-800 text-xs text-slate-400">
              <button onclick="toggleLike('${p._id}')" class="flex items-center gap-1.5 hover:text-rose-500 transition ${isLiked ? 'text-rose-500 font-bold' : ''}">
                <i data-lucide="heart" class="w-4 h-4 ${isLiked ? 'fill-current text-rose-500' : ''}"></i>
                <span>${p.likes.length}</span>
              </button>
              <button onclick="toggleComments('${p._id}')" class="flex items-center gap-1.5 hover:text-blue-400 transition">
                <i data-lucide="message-square" class="w-4 h-4"></i>
                <span>${p.comments.length}</span>
              </button>
            </div>

            <!-- Comment Drawer -->
            <div id="comments-box-${p._id}" class="hidden mt-4 pt-3 border-t border-slate-800/60 space-y-2">
              <div class="space-y-2 max-h-40 overflow-y-auto">
                ${p.comments.map(c => `
                  <div class="text-[11px] bg-slate-950/60 p-2.5 rounded-xl border border-slate-800">
                    <span class="font-bold text-blue-400">@${c.authorHandle}: </span>
                    <span class="text-slate-300">${c.text}</span>
                  </div>
                `).join('')}
              </div>
              <div class="flex gap-2 pt-2">
                <input type="text" id="input-${p._id}" placeholder="Reply to thread..." class="flex-1 px-3 py-1.5 rounded-xl bg-slate-950/80 border border-slate-800 text-xs text-white outline-none focus:border-blue-500">
                <button onclick="addComment('${p._id}')" class="px-3.5 py-1.5 bg-blue-600 hover:bg-blue-500 text-white rounded-xl text-xs font-bold transition">Send</button>
              </div>
            </div>
          </article>
        `;
      }).join('');
      lucide.createIcons();
    }

    async function publishPost() {
      if (!token) return openAuthModal();
      const content = document.getElementById('post-content').value.trim();
      const media = document.getElementById('post-media').value.trim();
      if (!content) return showToast('Content cannot be empty');

      const res = await fetch('/api/posts', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${token}` },
        body: JSON.stringify({ content, media })
      });
      if (res.ok) {
        document.getElementById('post-content').value = '';
        document.getElementById('post-media').value = '';
        await loadFeed();
        showToast('Transmitted to live mesh');
      }
    }

    async function deletePost(id) {
      if (!confirm("Delete this transmission permanently?")) return;
      const res = await fetch(`/api/posts/${id}`, {
        method: 'DELETE',
        headers: { 'Authorization': `Bearer ${token}` }
      });
      if (res.ok) {
        showToast('Transmission deleted');
        await loadFeed();
      }
    }

    async function toggleLike(id) {
      if (!token) return openAuthModal();
      const res = await fetch(`/api/posts/${id}/like`, {
        method: 'POST',
        headers: { 'Authorization': `Bearer ${token}` }
      });
      if (res.ok) await loadFeed();
    }

    function toggleComments(id) {
      document.getElementById(`comments-box-${id}`).classList.toggle('hidden');
    }

    async function addComment(id) {
      if (!token) return openAuthModal();
      const input = document.getElementById(`input-${id}`);
      if (!input.value.trim()) return;

      const res = await fetch(`/api/posts/${id}/comment`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${token}` },
        body: JSON.stringify({ text: input.value.trim() })
      });
      if (res.ok) {
        input.value = '';
        await loadFeed();
        document.getElementById(`comments-box-${id}`).classList.remove('hidden');
      }
    }

    // Profile Edit Functions
    function openEditProfileModal() {
      if (!currentUser) return;
      document.getElementById('edit-name').value = currentUser.name || '';
      document.getElementById('edit-bio').value = currentUser.bio || '';
      document.getElementById('edit-avatar').value = currentUser.avatar || '';
      document.getElementById('edit-profile-modal').classList.replace('hidden', 'flex');
    }
    function closeEditProfileModal() {
      document.getElementById('edit-profile-modal').classList.replace('flex', 'hidden');
    }

    async function handleProfileUpdate(e) {
      e.preventDefault();
      const name = document.getElementById('edit-name').value;
      const bio = document.getElementById('edit-bio').value;
      const avatar = document.getElementById('edit-avatar').value;

      const res = await fetch('/api/users/profile', {
        method: 'PUT',
        headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${token}` },
        body: JSON.stringify({ name, bio, avatar })
      });
      if (res.ok) {
        const updated = await res.json();
        currentUser = { ...currentUser, name: updated.name, bio: updated.bio, avatar: updated.avatar };
        localStorage.setItem('pulse_user', JSON.stringify(currentUser));
        closeEditProfileModal();
        showToast('Profile updated!');
        syncUser();
        await loadFeed();
      }
    }

    function openAuthModal() { document.getElementById('auth-modal').classList.replace('hidden', 'flex'); }
    function closeAuthModal() { document.getElementById('auth-modal').classList.replace('flex', 'hidden'); }

    function toggleAuthMode() {
      isRegister = !isRegister;
      document.getElementById('auth-title').innerText = isRegister ? 'Join NEXUS Mesh' : 'Enter NEXUS';
      document.getElementById('register-fields').classList.toggle('hidden', !isRegister);
      document.getElementById('auth-switch-text').innerText = isRegister ? 'Already registered?' : 'New to NEXUS?';
      document.getElementById('auth-switch-btn').innerText = isRegister ? 'Sign in' : 'Sign up';
    }

    async function handleAuth(e) {
      e.preventDefault();
      const endpoint = isRegister ? '/api/auth/register' : '/api/auth/login';
      const body = {
        email: document.getElementById('auth-email').value,
        password: document.getElementById('auth-password').value
      };
      if (isRegister) {
        body.name = document.getElementById('reg-name').value;
        body.handle = document.getElementById('reg-handle').value;
      }

      const res = await fetch(endpoint, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(body)
      });
      const data = await res.json();
      if (res.ok) {
        localStorage.setItem('pulse_token', data.token);
        localStorage.setItem('pulse_user', JSON.stringify(data.user));
        location.reload();
      } else {
        showToast(data.error);
      }
    }

    function logout() {
      localStorage.clear();
      location.reload();
    }

    init();
  </script>
</body>
</html>
