<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NEXUS // Developer Social Mesh</title>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%233b82f6' stroke-width='2.5' stroke-linecap='round' stroke-linejoin='round'><circle cx='12' cy='12' r='10'/><path d='m4.93 4.93 4.24 4.24'/><path d='m14.83 9.17 4.24-4.24'/><path d='m14.83 14.83 4.24 4.24'/><path d='m9.17 14.83-4.24 4.24'/><circle cx='12' cy='12' r='4'/></svg>">
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
    }
  </script>
  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap');
    body { font-family: 'Plus Jakarta Sans', sans-serif; transition: background-color 0.3s ease, color 0.3s ease; }
    .font-brand { font-family: 'Space Grotesk', sans-serif; }

    #neural-canvas {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      z-index: 0;
      pointer-events: none;
    }

    .dark .glass-nav {
      background: rgba(8, 12, 22, 0.85);
      backdrop-filter: blur(18px);
      border-bottom: 1px solid rgba(255, 255, 255, 0.08);
    }
    .glass-nav {
      background: rgba(255, 255, 255, 0.85);
      backdrop-filter: blur(18px);
      border-bottom: 1px solid rgba(0, 0, 0, 0.08);
    }

    .dark .glass-card {
      background: rgba(15, 23, 42, 0.7);
      backdrop-filter: blur(14px);
      border: 1px solid rgba(255, 255, 255, 0.07);
    }
    .glass-card {
      background: rgba(255, 255, 255, 0.8);
      backdrop-filter: blur(14px);
      border: 1px solid rgba(0, 0, 0, 0.08);
      box-shadow: 0 4px 20px -2px rgba(0,0,0,0.05);
    }

    .dark .glass-card:hover {
      border-color: rgba(59, 130, 246, 0.5);
      box-shadow: 0 16px 36px -10px rgba(59, 130, 246, 0.2);
    }
    .glass-card:hover {
      border-color: rgba(59, 130, 246, 0.5);
      box-shadow: 0 16px 36px -10px rgba(59, 130, 246, 0.15);
    }
  </style>
</head>
<body class="bg-slate-50 dark:bg-[#060913] text-slate-800 dark:text-slate-100 min-h-screen flex flex-col antialiased relative selection:bg-blue-600 selection:text-white">

  <!-- Interactive Background Canvas -->
  <canvas id="neural-canvas"></canvas>

  <!-- Toast Micro-Notification -->
  <div id="toast" class="fixed bottom-6 right-6 z-50 transform translate-y-20 opacity-0 transition-all duration-300 bg-white dark:bg-slate-900 border border-slate-200 dark:border-blue-500/30 text-slate-800 dark:text-white text-xs font-semibold px-4 py-3 rounded-2xl shadow-2xl flex items-center gap-2.5">
    <i data-lucide="radio" class="w-4 h-4 text-blue-500 animate-pulse"></i>
    <span id="toast-text">Mesh updated</span>
  </div>

  <!-- Sticky Navbar -->
  <header class="glass-nav sticky top-0 z-40 px-6 py-3.5 flex items-center justify-between">
    <div class="flex items-center gap-3">
      <!-- Nexus Brand Logo -->
      <div class="h-10 w-10 rounded-xl bg-gradient-to-tr from-blue-600 via-indigo-600 to-cyan-500 flex items-center justify-center shadow-lg shadow-blue-500/25 ring-1 ring-white/20">
        <svg class="w-5 h-5 text-white" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="10"/>
          <path d="m4.93 4.93 4.24 4.24"/>
          <path d="m14.83 9.17 4.24-4.24"/>
          <path d="m14.83 14.83 4.24 4.24"/>
          <path d="m9.17 14.83-4.24 4.24"/>
          <circle cx="12" cy="12" r="4"/>
        </svg>
      </div>
      <!-- AFTER -->
<div>
  <span class="text-xl font-black tracking-wider bg-gradient-to-r from-blue-600 to-indigo-600 dark:from-white dark:via-slate-100 dark:to-blue-300 bg-clip-text text-transparent font-brand">NEXUS</span>
  <span class="text-[10px] block font-bold tracking-widest text-blue-600 dark:text-blue-400 uppercase -mt-0.5">Social Platform</span>
</div>
    
    <div class="flex items-center gap-3">
      <!-- Theme Switcher -->
      <button onclick="toggleTheme()" class="h-9 w-9 rounded-xl flex items-center justify-center bg-slate-200 dark:bg-slate-800 text-slate-700 dark:text-slate-300 hover:text-blue-500 transition shadow-inner">
        <i id="theme-icon" data-lucide="moon" class="w-4 h-4"></i>
      </button>

      <!-- User Profile State -->
      <div id="user-info" class="hidden items-center gap-2.5">
        <a id="my-profile-link" href="#" class="text-xs font-semibold text-slate-700 dark:text-slate-200 hover:text-blue-600 transition flex items-center gap-2 bg-slate-200/70 dark:bg-slate-900/80 border border-slate-300 dark:border-slate-700/60 px-3 py-1.5 rounded-xl shadow">
          <img id="my-avatar" src="" class="w-5 h-5 rounded-full object-cover ring-1 ring-blue-500">
          <span id="my-name"></span>
        </a>
        <button onclick="logout()" class="text-xs font-semibold px-3 py-1.5 rounded-xl bg-slate-200 dark:bg-slate-800 hover:bg-slate-300 dark:hover:bg-slate-700 text-slate-600 dark:text-slate-300 transition flex items-center gap-1.5">
          <i data-lucide="log-out" class="w-3.5 h-3.5"></i>
          <span>Exit</span>
        </button>
      </div>

      <button id="auth-btn" onclick="openAuthModal()" class="text-xs font-bold px-4 py-2 rounded-xl bg-gradient-to-r from-blue-600 to-indigo-600 hover:opacity-95 text-white transition shadow-lg shadow-blue-500/25 flex items-center gap-1.5">
        <i data-lucide="user" class="w-3.5 h-3.5"></i>
        <span>Sign In</span>
      </button>
    </div>
  </header>

  <!-- Feed View -->
  <main class="max-w-2xl mx-auto px-4 py-8 flex-1 w-full space-y-6 relative z-10">

    <!-- Broadcast Box -->
    <div class="glass-card rounded-2xl p-5 border">
      <div class="flex items-center gap-2 mb-3">
        <i data-lucide="pen-tool" class="w-4 h-4 text-blue-500"></i>
        <h3 class="text-xs font-bold uppercase tracking-wider text-slate-600 dark:text-slate-300">Create Transmission</h3>
      </div>
      <textarea id="post-content" placeholder="Share technical findings, system architecture, or thoughts..." rows="3" class="w-full bg-slate-100/80 dark:bg-slate-950/70 border border-slate-300 dark:border-slate-800 rounded-xl p-3.5 text-xs text-slate-800 dark:text-white placeholder-slate-400 dark:placeholder-slate-500 outline-none focus:border-blue-500 transition resize-none"></textarea>
      <div class="relative mt-2.5">
        <i data-lucide="image" class="w-3.5 h-3.5 text-slate-400 dark:text-slate-500 absolute left-3.5 top-3"></i>
        <input type="text" id="post-media" placeholder="Image URL (optional)..." class="w-full pl-9 pr-3 py-2 bg-slate-100/80 dark:bg-slate-950/70 border border-slate-300 dark:border-slate-800 rounded-xl text-xs text-slate-800 dark:text-white placeholder-slate-400 dark:placeholder-slate-500 outline-none focus:border-blue-500 transition">
      </div>
      <div class="flex justify-between items-center mt-4 pt-3.5 border-t border-slate-200 dark:border-slate-800/80">
        <div class="flex items-center gap-2 text-[11px] text-slate-500">
          <span class="w-2 h-2 rounded-full bg-emerald-500 animate-pulse"></span>
          <span>NEXUS Synchronized</span>
        </div>
        <button onclick="publishPost()" class="px-4 py-2 rounded-xl bg-gradient-to-r from-blue-600 to-indigo-600 hover:opacity-95 text-white text-xs font-bold transition shadow-md shadow-blue-500/20 flex items-center gap-1.5">
          <i data-lucide="send" class="w-3.5 h-3.5"></i>
          <span>Publish</span>
        </button>
      </div>
    </div>

    <!-- Live Feed Stream -->
    <div id="feed-stream" class="space-y-4"></div>
  </main>

  <!-- Auth Modal -->
  <div id="auth-modal" class="fixed inset-0 z-50 bg-black/70 backdrop-blur-md hidden items-center justify-center p-4">
    <div class="glass-card max-w-sm w-full rounded-2xl p-6 relative shadow-2xl">
      <button onclick="closeAuthModal()" class="absolute top-4 right-4 text-slate-400 hover:text-slate-600 dark:hover:text-white text-lg font-bold">&times;</button>
      <div class="flex items-center gap-2 mb-1">
        <i data-lucide="shield" class="w-4 h-4 text-blue-500"></i>
        <h2 id="auth-title" class="text-base font-bold text-slate-900 dark:text-white">Enter NEXUS</h2>
      </div>
      <p class="text-slate-500 dark:text-slate-400 text-xs mb-4">Connect into the verified network</p>
      <form id="auth-form" onsubmit="handleAuth(event)" class="space-y-3">
        <div id="register-fields" class="space-y-3 hidden">
          <input type="text" id="reg-name" placeholder="Full Name" class="w-full px-3.5 py-2.5 rounded-xl bg-slate-100 dark:bg-slate-900 border border-slate-300 dark:border-slate-700 text-xs outline-none focus:border-blue-500">
          <input type="text" id="reg-handle" placeholder="System Handle (e.g. dev_sarang)" class="w-full px-3.5 py-2.5 rounded-xl bg-slate-100 dark:bg-slate-900 border border-slate-300 dark:border-slate-700 text-xs outline-none focus:border-blue-500">
        </div>
        <input type="email" id="auth-email" placeholder="Email Address" required class="w-full px-3.5 py-2.5 rounded-xl bg-slate-100 dark:bg-slate-900 border border-slate-300 dark:border-slate-700 text-xs outline-none focus:border-blue-500">
        <input type="password" id="auth-password" placeholder="Password" required class="w-full px-3.5 py-2.5 rounded-xl bg-slate-100 dark:bg-slate-900 border border-slate-300 dark:border-slate-700 text-xs outline-none focus:border-blue-500">
        <button type="submit" class="w-full py-2.5 rounded-xl bg-gradient-to-r from-blue-600 to-indigo-600 text-white font-bold text-xs transition shadow-lg shadow-blue-500/25">Continue</button>
      </form>
      <p class="text-center text-xs text-slate-500 dark:text-slate-400 mt-4">
        <span id="auth-switch-text">New to NEXUS?</span>
        <button onclick="toggleAuthMode()" class="text-blue-500 hover:underline ml-1 font-semibold" id="auth-switch-btn">Sign up</button>
      </p>
    </div>
  </div>

  <!-- Background Particle Animation -->
  <script>
    const canvas = document.getElementById('neural-canvas');
    const ctx = canvas.getContext('2d');
    let particles = [];

    function resizeCanvas() {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
    }
    window.addEventListener('resize', resizeCanvas);
    resizeCanvas();

    class NodeParticle {
      constructor() {
        this.x = Math.random() * canvas.width;
        this.y = Math.random() * canvas.height;
        this.vx = (Math.random() - 0.5) * 0.4;
        this.vy = (Math.random() - 0.5) * 0.4;
        this.radius = Math.random() * 1.5 + 0.8;
      }
      update() {
        this.x += this.vx;
        this.y += this.vy;
        if (this.x < 0 || this.x > canvas.width) this.vx *= -1;
        if (this.y < 0 || this.y > canvas.height) this.vy *= -1;
      }
      draw(isDark) {
        ctx.beginPath();
        ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
        ctx.fillStyle = isDark ? 'rgba(59, 130, 246, 0.5)' : 'rgba(59, 130, 246, 0.3)';
        ctx.fill();
      }
    }

    for (let i = 0; i < 40; i++) particles.push(new NodeParticle());

    function animate() {
      const isDark = document.documentElement.classList.contains('dark');
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      for (let i = 0; i < particles.length; i++) {
        particles[i].update();
        particles[i].draw(isDark);
        for (let j = i + 1; j < particles.length; j++) {
          const dx = particles[i].x - particles[j].x;
          const dy = particles[i].y - particles[j].y;
          const dist = Math.sqrt(dx * dx + dy * dy);
          if (dist < 110) {
            ctx.beginPath();
            ctx.moveTo(particles[i].x, particles[i].y);
            ctx.lineTo(particles[j].x, particles[j].y);
            ctx.strokeStyle = isDark ? `rgba(59, 130, 246, ${0.15 * (1 - dist / 110)})` : `rgba(59, 130, 246, ${0.1 * (1 - dist / 110)})`;
            ctx.lineWidth = 0.8;
            ctx.stroke();
          }
        }
      }
      requestAnimationFrame(animate);
    }
    animate();
  </script>

  <!-- Application Logic -->
  <script>
    let isRegister = false;
    const token = localStorage.getItem('pulse_token');
    const currentUser = JSON.parse(localStorage.getItem('pulse_user') || 'null');

    // Theme Management
    function initTheme() {
      const savedTheme = localStorage.getItem('nexus_theme') || 'dark';
      if (savedTheme === 'dark') {
        document.documentElement.classList.add('dark');
      } else {
        document.documentElement.classList.remove('dark');
      }
      updateThemeIcon();
    }

    function toggleTheme() {
      const isDark = document.documentElement.classList.toggle('dark');
      localStorage.setItem('nexus_theme', isDark ? 'dark' : 'light');
      updateThemeIcon();
    }

    function updateThemeIcon() {
      const isDark = document.documentElement.classList.contains('dark');
      const icon = document.getElementById('theme-icon');
      if (icon) {
        icon.setAttribute('data-lucide', isDark ? 'sun' : 'moon');
        lucide.createIcons();
      }
    }

    async function init() {
      initTheme();
      syncUser();
      await loadFeed();
      lucide.createIcons();
    }

    function showToast(msg) {
      const t = document.getElementById('toast');
      document.getElementById('toast-text').innerText = msg;
      t.classList.remove('translate-y-20', 'opacity-0');
      setTimeout(() => t.classList.add('translate-y-20', 'opacity-0'), 2500);
    }

    function syncUser() {
      if (token && currentUser) {
        document.getElementById('auth-btn').classList.add('hidden');
        document.getElementById('user-info').classList.replace('hidden', 'flex');
        document.getElementById('my-name').innerText = `@${currentUser.handle}`;
        document.getElementById('my-avatar').src = currentUser.avatar;
        document.getElementById('my-profile-link').href = `profile.html?handle=${currentUser.handle}`;
      }
    }

    async function loadFeed() {
      const res = await fetch('/api/posts');
      const posts = await res.json();
      const container = document.getElementById('feed-stream');
      
      container.innerHTML = posts.map(p => {
        const isLiked = currentUser && p.likes.includes(currentUser.id);
        return `
          <article class="glass-card rounded-2xl p-5 border" id="post-${p._id}">
            <div class="flex items-center gap-3 mb-3">
              <a href="profile.html?handle=${p.author.handle}">
                <img src="${p.author.avatar}" class="w-10 h-10 rounded-xl object-cover ring-1 ring-blue-500/40">
              </a>
              <div>
                <a href="profile.html?handle=${p.author.handle}" class="text-xs font-bold hover:text-blue-500 transition">${p.author.name}</a>
                <span class="text-[11px] text-slate-500 dark:text-slate-400 block -mt-0.5">@${p.author.handle}</span>
              </div>
            </div>
            
            <p class="text-xs sm:text-sm leading-relaxed mb-3">${p.content}</p>
            ${p.media ? `<img src="${p.media}" class="w-full max-h-80 object-cover rounded-xl mb-3 border border-slate-200 dark:border-slate-800">` : ''}

            <div class="flex items-center gap-6 pt-3 border-t border-slate-200 dark:border-slate-800 text-xs text-slate-500 dark:text-slate-400">
              <button onclick="toggleLike('${p._id}')" class="flex items-center gap-1.5 hover:text-rose-500 transition ${isLiked ? 'text-rose-500 font-bold' : ''}">
                <i data-lucide="heart" class="w-4 h-4 ${isLiked ? 'fill-current text-rose-500' : ''}"></i>
                <span id="likes-${p._id}">${p.likes.length}</span>
              </button>
              <button onclick="toggleComments('${p._id}')" class="flex items-center gap-1.5 hover:text-blue-500 transition">
                <i data-lucide="message-square" class="w-4 h-4"></i>
                <span>${p.comments.length}</span>
              </button>
            </div>

            <!-- Comments Component -->
            <div id="comments-box-${p._id}" class="hidden mt-4 pt-3 border-t border-slate-200 dark:border-slate-800/60 space-y-2">
              <div id="comment-list-${p._id}" class="space-y-2 max-h-40 overflow-y-auto">
                ${p.comments.map(c => `
                  <div class="text-[11px] bg-slate-100 dark:bg-slate-950/60 p-2.5 rounded-xl border border-slate-200 dark:border-slate-800">
                    <span class="font-bold text-blue-600 dark:text-blue-400">@${c.authorHandle}: </span>
                    <span>${c.text}</span>
                  </div>
                `).join('')}
              </div>
              <div class="flex gap-2 pt-2">
                <input type="text" id="input-${p._id}" placeholder="Reply to thread..." class="flex-1 px-3 py-1.5 rounded-xl bg-slate-100 dark:bg-slate-950/80 border border-slate-200 dark:border-slate-800 text-xs outline-none focus:border-blue-500">
                <button onclick="addComment('${p._id}')" class="px-3.5 py-1.5 bg-blue-600 hover:bg-blue-500 text-white rounded-xl text-xs font-bold transition">Send</button>
              </div>
            </div>
          </article>
        `;
      }).join('');
      lucide.createIcons();
    }

    async function publishPost() {
      if (!token) return openAuthModal();
      const content = document.getElementById('post-content').value;
      const media = document.getElementById('post-media').value;
      if (!content) return showToast('Transmission cannot be empty');

      const res = await fetch('/api/posts', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${token}` },
        body: JSON.stringify({ content, media })
      });
      if (res.ok) {
        document.getElementById('post-content').value = '';
        document.getElementById('post-media').value = '';
        await loadFeed();
        showToast('Transmitted to live mesh');
      }
    }

    async function toggleLike(id) {
      if (!token) return openAuthModal();
      const res = await fetch(`/api/posts/${id}/like`, {
        method: 'POST',
        headers: { 'Authorization': `Bearer ${token}` }
      });
      if (res.ok) {
        const data = await res.json();
        document.getElementById(`likes-${id}`).innerText = data.likesCount;
        await loadFeed();
      }
    }

    function toggleComments(id) {
      document.getElementById(`comments-box-${id}`).classList.toggle('hidden');
    }

    async function addComment(id) {
      if (!token) return openAuthModal();
      const input = document.getElementById(`input-${id}`);
      if (!input.value) return;

      const res = await fetch(`/api/posts/${id}/comment`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${token}` },
        body: JSON.stringify({ text: input.value })
      });
      if (res.ok) {
        input.value = '';
        await loadFeed();
        document.getElementById(`comments-box-${id}`).classList.remove('hidden');
        showToast('Comment recorded');
      }
    }

    function openAuthModal() { document.getElementById('auth-modal').classList.replace('hidden', 'flex'); }
    function closeAuthModal() { document.getElementById('auth-modal').classList.replace('flex', 'hidden'); }

    function toggleAuthMode() {
      isRegister = !isRegister;
      document.getElementById('auth-title').innerText = isRegister ? 'Join NEXUS Mesh' : 'Enter NEXUS';
      document.getElementById('register-fields').classList.toggle('hidden', !isRegister);
      document.getElementById('auth-switch-text').innerText = isRegister ? 'Already registered?' : 'New to NEXUS?';
      document.getElementById('auth-switch-btn').innerText = isRegister ? 'Sign in' : 'Sign up';
    }

    async function handleAuth(e) {
      e.preventDefault();
      const endpoint = isRegister ? '/api/auth/register' : '/api/auth/login';
      const body = {
        email: document.getElementById('auth-email').value,
        password: document.getElementById('auth-password').value
      };
      if (isRegister) {
        body.name = document.getElementById('reg-name').value;
        body.handle = document.getElementById('reg-handle').value;
      }

      const res = await fetch(endpoint, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(body)
      });
      const data = await res.json();
      if (res.ok) {
        localStorage.setItem('pulse_token', data.token);
        localStorage.setItem('pulse_user', JSON.stringify(data.user));
        location.reload();
      } else {
        showToast(data.error);
      }
    }

    function logout() {
      localStorage.clear();
      location.reload();
    }

    init();
  </script>
</body>
</html>
