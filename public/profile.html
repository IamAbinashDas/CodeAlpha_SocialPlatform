<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>NEXUS // Node Profile</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = { darkMode: "class" };
    </script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
      @import url("https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap");
      body {
        font-family: "Plus Jakarta Sans", sans-serif;
        transition:
          background-color 0.3s ease,
          color 0.3s ease;
      }
      .font-brand {
        font-family: "Space Grotesk", sans-serif;
      }
      .dark .glass-nav {
        background: rgba(8, 12, 22, 0.85);
        backdrop-filter: blur(18px);
        border-bottom: 1px solid rgba(255, 255, 255, 0.08);
      }
      .glass-nav {
        background: rgba(255, 255, 255, 0.85);
        backdrop-filter: blur(18px);
        border-bottom: 1px solid rgba(0, 0, 0, 0.08);
      }
      .dark .glass-card {
        background: rgba(15, 23, 42, 0.7);
        backdrop-filter: blur(14px);
        border: 1px solid rgba(255, 255, 255, 0.07);
      }
      .glass-card {
        background: rgba(255, 255, 255, 0.85);
        backdrop-filter: blur(14px);
        border: 1px solid rgba(0, 0, 0, 0.08);
      }
    </style>
  </head>
  <body
    class="bg-slate-50 dark:bg-[#060913] text-slate-800 dark:text-slate-100 min-h-screen flex flex-col antialiased"
  >
    <header
      class="glass-nav sticky top-0 z-40 px-6 py-3.5 flex items-center justify-between"
    >
      <a href="index.html" class="flex items-center gap-3">
        <div
          class="h-8 w-8 rounded-xl bg-gradient-to-tr from-blue-600 to-indigo-600 flex items-center justify-center font-bold text-white shadow-lg shadow-blue-500/20"
        >
          <i data-lucide="circle-dot" class="w-4 h-4"></i>
        </div>
        <span class="text-base font-bold font-brand">NEXUS</span>
      </a>
      <div class="flex items-center gap-3">
        <button
          onclick="toggleTheme()"
          class="h-8 w-8 rounded-xl flex items-center justify-center bg-slate-200 dark:bg-slate-800 text-slate-700 dark:text-slate-300"
        >
          <i id="theme-icon" data-lucide="moon" class="w-3.5 h-3.5"></i>
        </button>
        <a
          href="index.html"
          class="text-xs font-semibold text-slate-500 dark:text-slate-400 hover:text-blue-500 transition flex items-center gap-1.5"
        >
          <i data-lucide="arrow-left" class="w-3.5 h-3.5"></i>
          <span>Back to Stream</span>
        </a>
      </div>
    </header>

    <main
      class="max-w-2xl mx-auto px-4 py-8 flex-1 w-full space-y-6"
      id="profile-container"
    >
      <div class="text-center py-12 text-slate-400 text-xs">
        Querying node profile...
      </div>
    </main>

    <script>
      const token = localStorage.getItem("pulse_token");
      const currentUser = JSON.parse(
        localStorage.getItem("pulse_user") || "null",
      );

      function initTheme() {
        const savedTheme = localStorage.getItem("nexus_theme") || "dark";
        if (savedTheme === "dark")
          document.documentElement.classList.add("dark");
        else document.documentElement.classList.remove("dark");
        const icon = document.getElementById("theme-icon");
        if (icon)
          icon.setAttribute(
            "data-lucide",
            savedTheme === "dark" ? "sun" : "moon",
          );
      }

      function toggleTheme() {
        const isDark = document.documentElement.classList.toggle("dark");
        localStorage.setItem("nexus_theme", isDark ? "dark" : "light");
        initTheme();
        lucide.createIcons();
      }

      async function loadProfile() {
        const handle = new URLSearchParams(window.location.search).get(
          "handle",
        );
        if (!handle) return (window.location.href = "index.html");

        const res = await fetch(`/api/users/${handle}`);
        if (!res.ok) return (window.location.href = "index.html");
        const { user, posts } = await res.json();

        const isSelf = currentUser && currentUser.id === user._id;
        const isFollowing =
          currentUser && user.followers.includes(currentUser.id);

        document.getElementById("profile-container").innerHTML = `
        <div class="glass-card rounded-2xl p-6 border shadow-2xl">
          <div class="flex items-start justify-between">
            <img src="${user.avatar}" class="w-20 h-20 rounded-2xl object-cover ring-2 ring-blue-500/40 shadow-lg">
            ${
              !isSelf
                ? `
              <button onclick="toggleFollow('${user._id}')" class="px-4 py-2 rounded-xl text-xs font-bold transition shadow-md ${isFollowing ? "bg-slate-200 dark:bg-slate-800 text-slate-700 dark:text-slate-300" : "bg-gradient-to-r from-blue-600 to-indigo-600 text-white shadow-blue-500/25"}">
                ${isFollowing ? "Connected" : "+ Connect"}
              </button>
            `
                : ""
            }
          </div>

          <div class="flex items-center gap-2 mt-4">
            <h1 class="text-xl font-bold">${user.name}</h1>
            <span class="text-[10px] bg-blue-100 dark:bg-blue-950 text-blue-700 dark:text-blue-400 border border-blue-200 dark:border-blue-800/50 px-2 py-0.5 rounded-md font-bold uppercase tracking-widest">Verified</span>
          </div>
          <p class="text-xs text-blue-600 dark:text-blue-400 font-semibold">@${user.handle}</p>
          <p class="text-xs text-slate-600 dark:text-slate-300 mt-3 leading-relaxed">${user.bio}</p>

          <div class="flex gap-6 mt-4 pt-4 border-t border-slate-200 dark:border-slate-800 text-xs">
            <div><span class="font-bold text-sm">${user.followers.length}</span> <span class="text-slate-400 text-xs">Connections</span></div>
            <div><span class="font-bold text-sm">${user.following.length}</span> <span class="text-slate-400 text-xs">Following</span></div>
            <div><span class="font-bold text-sm">${posts.length}</span> <span class="text-slate-400 text-xs">Broadcasts</span></div>
          </div>
        </div>

        <h3 class="text-xs font-bold text-slate-400 uppercase tracking-wider px-1">Posts by @${user.handle}</h3>
        <div class="space-y-4">
          ${posts
            .map(
              (p) => `
            <div class="glass-card rounded-2xl p-5 border">
              <p class="text-xs leading-relaxed">${p.content}</p>
              ${p.media ? `<img src="${p.media}" class="w-full max-h-60 object-cover rounded-xl mt-3 border border-slate-200 dark:border-slate-800">` : ""}
              <div class="flex gap-4 mt-3 pt-3 border-t border-slate-200 dark:border-slate-800 text-[11px] text-slate-400">
                <span>❤️ ${p.likes.length} Likes</span>
                <span>💬 ${p.comments.length} Comments</span>
              </div>
            </div>
          `,
            )
            .join("")}
        </div>
      `;
        lucide.createIcons();
      }

      async function toggleFollow(id) {
        if (!token) return alert("Please login to connect.");
        const res = await fetch(`/api/users/${id}/follow`, {
          method: "POST",
          headers: { Authorization: `Bearer ${token}` },
        });
        if (res.ok) await loadProfile();
      }

      initTheme();
      loadProfile();
    </script>
  </body>
</html>
