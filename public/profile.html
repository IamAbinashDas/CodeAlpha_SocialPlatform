<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NEXUS // Node Profile</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap');
    body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: #060913; }
    .font-brand { font-family: 'Space Grotesk', sans-serif; }
    .glass-nav { background: rgba(8, 12, 22, 0.85); backdrop-filter: blur(18px); border-bottom: 1px solid rgba(255, 255, 255, 0.08); }
    .glass-card { background: rgba(15, 23, 42, 0.7); backdrop-filter: blur(14px); border: 1px solid rgba(255, 255, 255, 0.07); }
  </style>
</head>
<body class="bg-[#060913] text-slate-100 min-h-screen flex flex-col antialiased">

  <header class="glass-nav sticky top-0 z-40 px-6 py-3.5 flex items-center justify-between">
    <a href="index.html" class="flex items-center gap-3">
      <div class="h-8 w-8 rounded-xl bg-gradient-to-tr from-blue-600 to-indigo-600 flex items-center justify-center font-bold text-white shadow-lg shadow-blue-500/20">
        <i data-lucide="circle-dot" class="w-4 h-4"></i>
      </div>
      <span class="text-base font-bold font-brand text-white">NEXUS</span>
    </a>
    <a href="index.html" class="text-xs font-semibold text-slate-400 hover:text-blue-400 transition flex items-center gap-1.5">
      <i data-lucide="arrow-left" class="w-3.5 h-3.5"></i>
      <span>Back to Stream</span>
    </a>
  </header>

  <main class="max-w-2xl mx-auto px-4 py-8 flex-1 w-full space-y-6" id="profile-container">
    <div class="text-center py-12 text-slate-500 text-xs">Querying node profile...</div>
  </main>

  <!-- Edit Profile Modal -->
  <div id="edit-profile-modal" class="fixed inset-0 z-50 bg-black/80 backdrop-blur-md hidden items-center justify-center p-4">
    <div class="glass-card max-w-sm w-full rounded-2xl p-6 relative border border-slate-700 shadow-2xl">
      <button onclick="closeEditModal()" class="absolute top-4 right-4 text-slate-400 hover:text-white">&times;</button>
      <h2 class="text-base font-bold text-white mb-1">Edit Profile Details</h2>
      <p class="text-slate-400 text-xs mb-4">Set your photo URL and bio</p>
      
      <form onsubmit="saveProfileChanges(event)" class="space-y-3">
        <div>
          <label class="block text-[11px] font-bold text-slate-400 uppercase mb-1">Name</label>
          <input type="text" id="prof-name" class="w-full px-3.5 py-2 rounded-xl bg-slate-900 border border-slate-700 text-xs text-white outline-none focus:border-blue-500">
        </div>
        <div>
          <label class="block text-[11px] font-bold text-slate-400 uppercase mb-1">Profile Photo URL</label>
          <input type="url" id="prof-avatar" placeholder="https://..." class="w-full px-3.5 py-2 rounded-xl bg-slate-900 border border-slate-700 text-xs text-white outline-none focus:border-blue-500">
        </div>
        <div>
          <label class="block text-[11px] font-bold text-slate-400 uppercase mb-1">Bio</label>
          <textarea id="prof-bio" rows="2" class="w-full px-3.5 py-2 rounded-xl bg-slate-900 border border-slate-700 text-xs text-white outline-none focus:border-blue-500 resize-none"></textarea>
        </div>
        <button type="submit" class="w-full py-2.5 rounded-xl bg-blue-600 hover:bg-blue-500 text-white font-bold text-xs">Update Profile</button>
      </form>
    </div>
  </div>

  <script>
    const token = localStorage.getItem('pulse_token');
    let currentUser = JSON.parse(localStorage.getItem('pulse_user') || 'null');
    let profileUserData = null;

    function renderAvatar(avatarUrl, name, sizeClass = "w-20 h-20") {
      if (avatarUrl && avatarUrl.trim().length > 0) {
        return `<img src="${avatarUrl}" class="${sizeClass} rounded-2xl object-cover ring-2 ring-blue-500/40 shadow-lg">`;
      }
      const initial = (name || 'U').charAt(0).toUpperCase();
      return `
        <div class="${sizeClass} rounded-2xl bg-gradient-to-tr from-slate-800 to-slate-700 border border-slate-600 flex items-center justify-center font-bold text-white text-xl font-mono shadow-lg">
          ${initial}
        </div>
      `;
    }

    async function loadProfile() {
      const handle = new URLSearchParams(window.location.search).get('handle');
      if (!handle) return window.location.href = 'index.html';

      const res = await fetch(`/api/users/${handle}`);
      if (!res.ok) return window.location.href = 'index.html';
      const { user, posts } = await res.json();
      profileUserData = user;

      const isSelf = currentUser && currentUser.id === user._id;
      const isFollowing = currentUser && user.followers.includes(currentUser.id);

      document.getElementById('profile-container').innerHTML = `
        <div class="glass-card rounded-2xl p-6 border shadow-2xl">
          <div class="flex items-start justify-between">
            ${renderAvatar(user.avatar, user.name, "w-20 h-20")}
            ${isSelf ? `
              <button onclick="openEditModal()" class="px-4 py-2 rounded-xl text-xs font-bold bg-slate-800 hover:bg-slate-700 text-slate-200 border border-slate-700 flex items-center gap-1.5 transition">
                <i data-lucide="edit-3" class="w-3.5 h-3.5 text-blue-400"></i>
                <span>Edit Profile</span>
              </button>
            ` : `
              <button onclick="toggleFollow('${user._id}')" class="px-4 py-2 rounded-xl text-xs font-bold transition shadow-md ${isFollowing ? 'bg-slate-800 text-slate-300 border border-slate-700' : 'bg-gradient-to-r from-blue-600 to-indigo-600 text-white shadow-blue-500/25'}">
                ${isFollowing ? 'Connected' : '+ Connect'}
              </button>
            `}
          </div>

          <div class="flex items-center gap-2 mt-4">
            <h1 class="text-xl font-bold text-white">${user.name}</h1>
            <span class="text-[10px] bg-blue-950 text-blue-400 border border-blue-800/50 px-2 py-0.5 rounded-md font-bold uppercase tracking-widest">Verified</span>
          </div>
          <p class="text-xs text-blue-400 font-semibold">@${user.handle}</p>
          <p class="text-xs text-slate-300 mt-3 leading-relaxed">${user.bio || 'Exploring the mesh protocol.'}</p>

          <div class="flex gap-6 mt-4 pt-4 border-t border-slate-800 text-xs">
            <div><span class="font-bold text-sm text-white">${user.followers.length}</span> <span class="text-slate-400 text-xs">Connections</span></div>
            <div><span class="font-bold text-sm text-white">${user.following.length}</span> <span class="text-slate-400 text-xs">Following</span></div>
            <div><span class="font-bold text-sm text-white">${posts.length}</span> <span class="text-slate-400 text-xs">Broadcasts</span></div>
          </div>
        </div>

        <h3 class="text-xs font-bold text-slate-400 uppercase tracking-wider px-1">Posts by @${user.handle}</h3>
        <div class="space-y-4">
          ${posts.length ? posts.map(p => `
            <div class="glass-card rounded-2xl p-5 border">
              <div class="flex justify-between items-start">
                <p class="text-xs leading-relaxed text-slate-200">${p.content}</p>
                ${isSelf ? `
                  <button onclick="deleteProfilePost('${p._id}')" class="text-slate-500 hover:text-rose-400 ml-2">
                    <i data-lucide="trash-2" class="w-3.5 h-3.5"></i>
                  </button>
                ` : ''}
              </div>
              ${p.media ? `<img src="${p.media}" class="w-full max-h-60 object-cover rounded-xl mt-3 border border-slate-800">` : ''}
              <div class="flex gap-4 mt-3 pt-3 border-t border-slate-800 text-[11px] text-slate-400">
                <span>❤️ ${p.likes.length} Likes</span>
                <span>💬 ${p.comments.length} Comments</span>
              </div>
            </div>
          `).join('') : `<div class="glass-card rounded-2xl p-6 text-center text-xs text-slate-500">No broadcasts published yet.</div>`}
        </div>
      `;
      lucide.createIcons();
    }

    function openEditModal() {
      if (!profileUserData) return;
      document.getElementById('prof-name').value = profileUserData.name || '';
      document.getElementById('prof-bio').value = profileUserData.bio || '';
      document.getElementById('prof-avatar').value = profileUserData.avatar || '';
      document.getElementById('edit-profile-modal').classList.replace('hidden', 'flex');
    }

    function closeEditModal() {
      document.getElementById('edit-profile-modal').classList.replace('flex', 'hidden');
    }

    async function saveProfileChanges(e) {
      e.preventDefault();
      const name = document.getElementById('prof-name').value;
      const bio = document.getElementById('prof-bio').value;
      const avatar = document.getElementById('prof-avatar').value;

      const res = await fetch('/api/users/profile', {
        method: 'PUT',
        headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${token}` },
        body: JSON.stringify({ name, bio, avatar })
      });
      if (res.ok) {
        const updated = await res.json();
        currentUser = { ...currentUser, name: updated.name, bio: updated.bio, avatar: updated.avatar };
        localStorage.setItem('pulse_user', JSON.stringify(currentUser));
        closeEditModal();
        await loadProfile();
      }
    }

    async function deleteProfilePost(id) {
      if (!confirm("Delete transmission?")) return;
      const res = await fetch(`/api/posts/${id}`, {
        method: 'DELETE',
        headers: { 'Authorization': `Bearer ${token}` }
      });
      if (res.ok) await loadProfile();
    }

    async function toggleFollow(id) {
      if (!token) return alert('Please login to connect.');
      const res = await fetch(`/api/users/${id}/follow`, {
        method: 'POST',
        headers: { 'Authorization': `Bearer ${token}` }
      });
      if (res.ok) await loadProfile();
    }

    loadProfile();
  </script>
</body>
</html>
